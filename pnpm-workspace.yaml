packages:
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'

# One version per tool, referenced from every package as `"catalog:"`. A single edit here moves the
# whole workspace, and two packages on two versions of one library stops being possible.
# Phaser is 4 — the stable major at S0 (4.2.1 on 2026-10-03), decided in ROADMAP.md § Open questions.
catalog:
  '@fastify/static': ^8
  '@playwright/test': 1.62.1
  '@types/ws': ^8
  fastify: ^5
  happy-dom: ^20
  phaser: ^4.2.1
  pino: ^9
  tsx: ^4
  typescript: ^5
  vite: ^8
  vitest: ^3
  ws: ^8

onlyBuiltDependencies:
  - esbuild
